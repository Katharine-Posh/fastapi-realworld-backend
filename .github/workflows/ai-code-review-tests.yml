name: AI Code Review Tests

# The review workflow uses `pull_request_target` and therefore always runs
# the trusted base-branch script. This workflow checks out the PR head and
# runs the offline tests only: no secrets, no Groq calls, no tokens spent.
on:
  pull_request:
    paths:
      - scripts/ai_code_review.py
      - tests/ai_review/**
      - .github/workflows/ai-code-review*.yml

permissions:
  contents: read

jobs:
  test:
    name: Offline review tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install openai pytest

      - name: Run offline tests
        run: python -m pytest --confcutdir=tests/ai_review tests/ai_review -q
